workflows:
  android-workflow:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - stayfix_upload_keystore
      vars:
        PACKAGE_NAME: "com.rezzaky.stayfix"
    scripts:
      - name: Generate .env file
        script: |
          echo "VPS_MEDIA_BASE_URL=$VPS_MEDIA_BASE_URL" >> .env
          echo "STAYFIX_EMAIL_SECRET=$STAYFIX_EMAIL_SECRET" >> .env
          echo "STAYFIX_EMAIL_WEB_APP_URL=$STAYFIX_EMAIL_WEB_APP_URL" >> .env
          echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" >> .env

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$(($(google-play get-latest-build-number \
              --package-name "$PACKAGE_NAME" \
              --tracks="$GOOGLE_PLAY_TRACK") + 1))

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-workflow:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rezzaky.stayfix
    scripts:
      - name: Generate .env file
        script: |
          echo "VPS_MEDIA_BASE_URL=$VPS_MEDIA_BASE_URL" >> .env
          echo "STAYFIX_EMAIL_SECRET=$STAYFIX_EMAIL_SECRET" >> .env
          echo "STAYFIX_EMAIL_WEB_APP_URL=$STAYFIX_EMAIL_WEB_APP_URL" >> .env
          echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" >> .env

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install Pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
